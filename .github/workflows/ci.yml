# CI — P2-CI-001/002 (billing offline gate first, then secret scan).
name: CI

on:
  push:
    branches: [main, product-referral-cabinet-ui-v1]
  pull_request:
    branches: [main, product-referral-cabinet-ui-v1]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billing-offline:
    name: Billing offline (BILL-UT)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test runner
        run: pip install -r requirements-ci.txt

      - name: py_compile billing modules
        run: |
          python -m py_compile bot_src/config.py bot_src/balance_billing.py

      - name: pytest billing gate
        run: |
          python -m pytest \
            tests/test_balance_billing.py \
            tests/test_yookassa_topup_idempotency.py \
            tests/test_webhook_claim_toctou.py \
            tests/test_payment_amount_verify.py \
            tests/test_bill_terms_guard.py \
            tests/test_portal_cabinet_billing.py \
            -q --tb=short

      - name: portal ru.json valid JSON
        run: python -m json.tool web/portal/content/ru.json > /dev/null

  gitleaks:
    name: Secret scan (P2-CI-002)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
