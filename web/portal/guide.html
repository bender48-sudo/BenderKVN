<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>BenderVPN — видео-инструкция</title>
  <link rel="stylesheet" href="/portal/assets/portal.css">
  <script src="/portal/assets/guide.js" defer></script>
</head>
<body>
  <main>
    <header class="top top--sub">
      <h1 class="brand-name" id="guide-title">BenderVPN</h1>
      <a class="nav-link" href="/start/">← Главная</a>
    </header>

    <p id="guide-lead" class="lead"></p>
    <p id="guide-auto-note" class="callout callout--warn" role="note"></p>

    <div class="guide-tabs" role="tablist" aria-label="Платформа">
      <button type="button" class="guide-tab guide-tab--active" id="tab-ios" role="tab" aria-selected="true" aria-controls="panel-ios" data-device="iphone"></button>
      <button type="button" class="guide-tab" id="tab-android" role="tab" aria-selected="false" aria-controls="panel-android" data-device="android"></button>
    </div>

    <section id="panel-ios" class="guide-panel" role="tabpanel" aria-labelledby="tab-ios">
      <p class="muted" id="guide-ios-caption"></p>
      <div class="guide-media" id="media-ios"></div>
    </section>

    <section id="panel-android" class="guide-panel hidden" role="tabpanel" aria-labelledby="tab-android" hidden>
      <p class="muted" id="guide-android-caption"></p>
      <div class="guide-media" id="media-android"></div>
    </section>

    <div class="actions">
      <a class="btn btn--primary btn--block" id="btn-guide-setup" href="/setup/">Получить настройку</a>
      <a class="btn btn--secondary btn--block" id="btn-guide-portal" href="/start/">На главную</a>
    </div>

    <nav class="footer-nav">
      <a class="btn btn--ghost" href="/start/help/errors/">Частые проблемы</a>
      <a class="btn btn--ghost" href="/status">Статус</a>
    </nav>
  </main>
</body>
</html>
