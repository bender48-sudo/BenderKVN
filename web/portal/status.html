<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Статус сервиса — BenderVPN</title>
  <link rel="stylesheet" href="/portal/assets/portal.css">
  <script src="/portal/assets/portal-shared.js" defer></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", function () {
      fetch("/portal/content/ru.json")
        .then(function (r) { return r.json(); })
        .then(function (c) {
          var st = c.status_page || {};
          document.getElementById("status-lead").textContent =
            st.lead_local || "Локальная страница для разработки.";
          var m = document.getElementById("site-footer-mount");
          if (m && window.BenderPortalShared) {
            BenderPortalShared.renderSiteFooter(m, c);
          }
        })
        .catch(function () {});
      if (window.BenderPortalShared && !BenderPortalShared.isLocalDev()) {
        window.location.replace("/status");
      }
    });
  </script>
</head>
<body>
  <main>
    <header class="top top--sub">
      <h1 class="brand-name">Статус сервиса</h1>
      <a class="nav-link" href="/start/">← Главная</a>
    </header>
    <section class="sheet">
      <p class="status__dot status__dot--ok" style="display:inline-block;vertical-align:middle;margin-right:0.35rem" aria-hidden="true"></p>
      <strong>Всё в порядке</strong>
      <p id="status-lead" class="muted" style="margin-top:0.75rem"></p>
      <p class="muted">
        На продакшене эта страница — публичный статус инцидентов:
        <a class="site-footer__link" href="https://k9x2m1.conntest.xyz:8443/status">k9x2m1.conntest.xyz/status</a>
      </p>
    </section>
    <div id="site-footer-mount"></div>
  </main>
</body>
</html>
