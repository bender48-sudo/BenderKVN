<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>BenderVPN</title>
  <link rel="stylesheet" href="/portal/assets/portal.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js" defer></script>
  <script>window.BVPN_FOCUS_ACCOUNT = true;</script>
  <script src="/portal/assets/portal.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">К основному содержимому</a>
  <main id="main-content" tabindex="-1">
    <header class="top">
      <h1 class="top__title" id="page-title">BenderVPN</h1>
      <a class="top__link" href="/status" id="nav-status-link">Статус</a>
    </header>

    <p id="load-error" class="banner banner--error hidden" role="alert"></p>

    <section data-view="home">
      <p class="hero" id="page-subtitle"></p>
      <p class="hero-tag hidden" id="hero-badge"></p>

      <section class="sheet" id="account-sheet" aria-labelledby="account-heading">
        <h2 class="visually-hidden" id="account-heading">Ваш доступ</h2>
        <p class="sheet__label" id="cabinet-balance-label">Баланс</p>
        <p class="cabinet-balance" id="cabinet-balance" aria-live="polite">—</p>
        <p class="muted" id="cabinet-balance-hint"></p>
        <p class="banner banner--warn hidden" id="cabinet-load-error" role="alert"></p>
        <p class="muted" id="cabinet-web-notify"></p>

        <div class="login hidden" id="cabinet-login-panel">
          <label class="field" for="cabinet-customer-id">
            <span class="field__label" id="cabinet-customer-id-label">ID</span>
            <input type="text" id="cabinet-customer-id" class="field__input" autocomplete="off">
          </label>
          <label class="field" for="cabinet-email">
            <span class="field__label" id="cabinet-email-label">Email</span>
            <input type="email" id="cabinet-email" class="field__input" autocomplete="email">
          </label>
          <button type="button" class="btn btn--secondary btn--block" id="btn-cabinet-load"></button>
        </div>

        <div class="sheet__actions">
          <a class="btn btn--secondary btn--block hidden" id="btn-cabinet-bind" href="#" target="_blank" rel="noopener"></a>
          <a class="btn btn--ghost btn--block" id="btn-cabinet-bot" href="https://t.me/Bender_KVN_bot" target="_blank" rel="noopener"></a>
        </div>
      </section>

      <div class="status" id="events-card" aria-live="polite">
        <span class="status__dot" id="events-pill" role="status"></span>
        <div class="status__body">
          <p class="status__title hidden" id="events-title">Обновления</p>
          <p class="status__text" id="events-detail"></p>
          <ol class="status__steps hidden" id="events-steps"></ol>
          <div class="status__actions">
            <button type="button" class="btn btn--small hidden" id="btn-events-ack"></button>
            <a class="text-link" id="btn-events-more" href="/status"></a>
          </div>
        </div>
      </div>

      <div class="cta">
        <a class="btn btn--primary btn--block" id="btn-setup" href="/setup/">Начать</a>
        <button type="button" class="btn btn--secondary btn--block" id="btn-connect"></button>
      </div>

      <nav class="inline-nav" aria-label="Помощь">
        <a class="text-link" id="btn-guide" href="/portal/guide.html"></a>
        <span class="inline-nav__sep" aria-hidden="true">·</span>
        <a class="text-link" id="btn-support" href="https://t.me/Bender_KVN_bot" target="_blank" rel="noopener"></a>
        <span class="inline-nav__sep" aria-hidden="true">·</span>
        <button type="button" class="text-link text-link--btn" id="btn-stuck"></button>
        <span class="inline-nav__sep" aria-hidden="true">·</span>
        <a class="text-link" id="btn-help-errors" href="/start/help/errors/"></a>
      </nav>

      <details class="fold" id="help-stuck-panel">
        <summary id="help-stuck-title">Что проверить</summary>
        <ol class="fold__list" id="help-stuck-steps"></ol>
      </details>

      <details class="fold" id="fold-about">
        <summary id="fold-about-title">О сервисе</summary>
        <div class="fold__body" id="fold-about-body"></div>
      </details>

      <ul id="hero-stack" class="hidden" aria-hidden="true"></ul>
      <p id="devices-note" class="hidden"></p>
      <p id="tg-blocked-title" class="hidden"></p>
      <p id="tg-blocked-body" class="hidden"></p>
      <p id="happ-note" class="hidden"></p>
      <button type="button" id="btn-cabinet" class="hidden" aria-hidden="true"></button>
      <a id="btn-cabinet-setup" class="hidden" href="/setup/" aria-hidden="true"></a>
    </section>

    <section data-view="devices" class="hidden" aria-labelledby="devices-heading">
      <button type="button" class="back" id="btn-back-home">← Назад</button>
      <h2 class="section-title" id="devices-heading">Устройство</h2>
      <p class="muted" id="devices-lead"></p>
      <div id="device-grid" class="device-grid" role="list"></div>
    </section>

    <section data-view="device" class="hidden">
      <button type="button" class="back" id="btn-back-devices">← Назад</button>
      <h2 class="section-title" id="device-detail-title"></h2>
      <div class="sheet hidden" id="device-qr-panel">
        <h3 class="sheet__label" id="device-qr-title">QR</h3>
        <p class="muted" id="device-qr-hint"></p>
        <div class="qr-wrap">
          <canvas id="device-sub-qr" aria-label="QR подписки"></canvas>
        </div>
        <p class="muted hidden" id="device-qr-missing"></p>
      </div>
      <div class="sheet">
        <h3 class="sheet__label" id="install-steps-title">Установка</h3>
        <ol class="steps" id="device-install-steps"></ol>
      </div>
      <div class="sheet">
        <h3 class="sheet__label" id="after-title">Дальше</h3>
        <ol class="steps" id="after-device-steps"></ol>
      </div>
      <a class="btn btn--ghost btn--block" id="btn-device-support" href="https://t.me/Bender_KVN_bot" target="_blank" rel="noopener">Написать в поддержку</a>
    </section>

    <section data-view="cabinet" class="hidden" aria-hidden="true">
      <button type="button" class="back" id="btn-back-home-cabinet">← Назад</button>
      <h2 id="cabinet-title" class="hidden">Мой VPN</h2>
      <p id="cabinet-lead" class="hidden"></p>
    </section>
  </main>
</body>
</html>
