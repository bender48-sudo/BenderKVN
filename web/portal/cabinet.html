<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Личный кабинет — BenderVPN</title>
  <link rel="stylesheet" href="/portal/assets/portal.css?v=31">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="/portal/assets/qrcode.min.js?v=30" defer></script>
  <script src="/portal/assets/portal-shared.js?v=30" defer></script>
  <script>window.BVPN_FOCUS_ACCOUNT = true;</script>
  <script src="/portal/assets/portal.js?v=31" defer></script>
</head>
<body class="cosmic cabinet-page">
  <div class="cosmic-bg" aria-hidden="true"></div>
  <a class="skip-link" href="#main-content">К основному содержимому</a>
  <main id="main-content" class="cabinet-main" tabindex="-1">
    <header class="top top--sub">
      <p class="top__eyebrow">BenderVPN</p>
      <a class="top__link" href="/status" id="nav-status-link" data-bvpn-status="1">Статус</a>
    </header>

    <p id="load-error" class="banner banner--error hidden" role="alert"></p>

    <section data-view="home">
      <header class="cabinet-hero glass">
        <div class="hero-orb cabinet-hero__orb" aria-hidden="true"></div>
        <h1 class="cabinet-hero__title" id="cabinet-page-title">Личный кабинет BenderVPN</h1>
        <p class="cabinet-hero__subline muted" id="cabinet-lead-inline"></p>
        <p class="cabinet-hero__state" id="cabinet-access-state" aria-live="polite"></p>
      </header>

      <section class="cabinet-grace glass hidden" id="cabinet-grace" aria-labelledby="cabinet-grace-title">
        <h2 class="cabinet-grace__title" id="cabinet-grace-title"></h2>
        <p class="cabinet-grace__lead muted" id="cabinet-grace-lead"></p>
        <div class="cabinet-grace__paths">
          <div class="cabinet-grace__path">
            <p class="muted cabinet-grace__note" id="cabinet-grace-tg-note"></p>
            <a class="btn btn--primary btn--block" id="btn-cabinet-grace-bot" href="https://t.me/Bender_KVN_bot" target="_blank" rel="noopener"></a>
          </div>
          <div class="cabinet-grace__path">
            <p class="muted cabinet-grace__note" id="cabinet-grace-email-note"></p>
            <a class="btn btn--secondary btn--block" id="btn-cabinet-grace-trial" href="/setup/"></a>
          </div>
        </div>
      </section>

      <section class="cabinet-panel glass hidden" id="account-sheet" aria-labelledby="account-heading">
        <h2 class="visually-hidden" id="account-heading">Ваш доступ</h2>
        <div class="cabinet-balance-card">
          <p class="sheet__label" id="cabinet-balance-label">Баланс</p>
          <p class="cabinet-balance" id="cabinet-balance" aria-live="polite">—</p>
          <p class="muted" id="cabinet-balance-hint"></p>
        </div>
        <p class="banner banner--warn hidden" id="cabinet-load-error" role="alert"></p>
        <p class="muted hidden" id="cabinet-web-notify"></p>

        <div class="sheet sheet--nested glass hidden" id="cabinet-configs-panel">
          <p class="sheet__label" id="cabinet-configs-title">Мои устройства / настройки</p>
          <p class="muted cabinet-configs-summary" id="cabinet-configs-summary"></p>
          <ul class="config-list" id="cabinet-configs-list"></ul>
          <p class="callout callout--info muted hidden" id="cabinet-devices-billing-note" role="note"></p>
          <p class="callout callout--warn" id="cabinet-device-rule" role="note"></p>
          <p class="muted cabinet-device-reuse-note hidden" id="cabinet-device-reuse-note" role="note"></p>
          <div class="cabinet-device-actions">
            <a class="btn btn--primary btn--block" id="btn-add-device" href="https://t.me/Bender_KVN_bot" target="_blank" rel="noopener"></a>
            <p class="muted cabinet-device-action-hint" id="add-device-hint"></p>
            <a class="btn btn--secondary btn--block" id="btn-replace-device" href="https://t.me/Bender_KVN_bot" target="_blank" rel="noopener"></a>
            <p class="muted cabinet-device-action-hint" id="replace-device-hint"></p>
          </div>
        </div>

        <div class="sheet__actions cabinet-panel__bot">
          <a class="btn btn--secondary btn--block hidden" id="btn-cabinet-bind" href="https://t.me/Bender_KVN_bot" target="_blank" rel="noopener" hidden>Привязать Telegram</a>
        </div>
      </section>

      <nav class="cabinet-actions glass hidden" id="cabinet-actions" aria-label="Действия"></nav>

      <details class="fold glass cabinet-accordion cabinet-recover hidden" id="cabinet-recover-fold">
        <summary id="cabinet-recover-title"></summary>
        <div class="cabinet-accordion__body">
        <p class="muted" id="cabinet-recover-lead"></p>
        <p class="muted cabinet-recover-hint" id="cabinet-recover-tg-hint"></p>
        <button type="button" class="btn btn--ghost btn--block" id="btn-cabinet-show-tg-id"></button>
        <div class="cabinet-recover-id hidden" id="cabinet-recover-id-panel" aria-live="polite">
          <p class="cabinet-recover-id__label" id="cabinet-recover-id-label"></p>
          <p class="cabinet-recover-id__value" id="cabinet-recover-id-value"></p>
          <button type="button" class="btn btn--secondary btn--block" id="btn-cabinet-copy-tg-id"></button>
          <p class="cabinet-recover-id__fallback hidden" id="cabinet-recover-id-fallback" role="status">
            <span class="muted" id="cabinet-recover-id-fallback-label"></span>
            <code class="cabinet-recover-id__code" id="cabinet-recover-id-fallback-code"></code>
          </p>
        </div>
        <div class="login" id="cabinet-login-panel">
          <label class="field" for="cabinet-customer-id">
            <span class="field__label" id="cabinet-customer-id-label">ID</span>
            <input type="text" id="cabinet-customer-id" class="field__input" autocomplete="off">
          </label>
          <label class="field" for="cabinet-email">
            <span class="field__label" id="cabinet-email-label">Email</span>
            <input type="email" id="cabinet-email" class="field__input" autocomplete="email">
          </label>
          <button type="button" class="btn btn--secondary btn--block" id="btn-cabinet-load"></button>
        </div>
        </div>
      </details>

      <details class="fold glass cabinet-accordion" id="cabinet-faq-fold">
        <summary id="cabinet-faq-title">Частые вопросы</summary>
        <div class="cabinet-accordion__body">
          <div class="faq" id="cabinet-faq-list"></div>
        </div>
      </details>

      <p id="page-title" class="hidden" aria-hidden="true">BenderVPN</p>
      <p id="cabinet-lead" class="hidden" aria-hidden="true"></p>
      <h2 id="cabinet-title" class="hidden" aria-hidden="true"></h2>
      <a id="btn-cabinet-setup" class="hidden" href="/setup/" aria-hidden="true"></a>
      <a id="btn-cabinet-bot" class="hidden" href="https://t.me/Bender_KVN_bot" aria-hidden="true"></a>
      <button type="button" id="btn-cabinet" class="hidden" aria-hidden="true"></button>
    </section>

    <section data-view="devices" class="hidden" aria-labelledby="devices-heading">
      <button type="button" class="back" id="btn-back-home">← Назад</button>
      <h2 class="section-title" id="devices-heading">Устройство</h2>
      <p class="muted" id="devices-lead"></p>
      <div id="device-grid" class="device-grid" role="list"></div>
    </section>

    <section data-view="device" class="hidden">
      <button type="button" class="back" id="btn-back-devices">← Назад</button>
      <h2 class="section-title" id="device-detail-title"></h2>
      <div class="sheet hidden" id="device-qr-panel">
        <h3 class="sheet__label" id="device-qr-title">QR</h3>
        <p class="muted" id="device-qr-hint"></p>
        <div class="qr-wrap">
          <canvas id="device-sub-qr" aria-label="QR подписки"></canvas>
        </div>
        <p class="muted hidden" id="device-qr-missing"></p>
      </div>
      <div class="sheet">
        <h3 class="sheet__label" id="install-steps-title">Установка</h3>
        <ol class="steps" id="device-install-steps"></ol>
      </div>
      <div class="sheet">
        <h3 class="sheet__label" id="after-title">Дальше</h3>
        <ol class="steps" id="after-device-steps"></ol>
      </div>
      <a class="btn btn--ghost btn--block" id="btn-device-support" href="https://t.me/Bender_KVN_bot" target="_blank" rel="noopener">Написать в поддержку</a>
    </section>

    <section data-view="cabinet" class="hidden" aria-hidden="true">
      <button type="button" class="back" id="btn-back-home-cabinet">← Назад</button>
    </section>

    <div id="support-block-mount"></div>
    <div id="site-footer-mount"></div>
  </main>
</body>
</html>
