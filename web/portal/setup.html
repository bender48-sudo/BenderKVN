<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>BenderVPN — получить настройку</title>
  <link rel="stylesheet" href="/portal/assets/portal.css?v=27">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="/portal/assets/qrcode.min.js?v=27" defer></script>
  <script src="/portal/assets/portal-shared.js?v=27" defer></script>
  <script src="/portal/assets/setup.js?v=27" defer></script>
</head>
<body class="cosmic setup-page">
  <div class="cosmic-bg" aria-hidden="true"></div>
  <main class="setup-main">
    <header class="top top--sub">
      <p class="top__eyebrow">BenderVPN</p>
      <a class="nav-link" href="/start/">← Главная</a>
    </header>

    <section class="setup-hero glass" id="setup-hero">
      <h1 class="setup-hero__title" id="setup-hero-title">Получить настройку</h1>
      <p class="setup-hero__lead muted" id="setup-hero-lead"></p>
    </section>

    <p id="setup-loading" class="note hidden" role="status"></p>
    <p id="setup-error" class="banner banner--error hidden" role="alert"></p>
    <p id="setup-error-help" class="hidden setup-error-help">
      <a class="btn btn--ghost btn-no-code" id="setup-error-help-link" href="/start/help/errors/"></a>
    </p>

    <div id="setup-paths" class="setup-paths">
      <article class="setup-path-card glass" id="setup-path-tg">
        <span class="setup-badge" id="setup-tg-badge">90 дней</span>
        <h2 class="setup-path-card__title" id="setup-tg-title"></h2>
        <p class="muted setup-path-card__lead" id="setup-tg-lead"></p>
        <a class="btn btn--primary btn--block" id="btn-setup-tg" href="https://t.me/Bender_KVN_bot" target="_blank" rel="noopener"></a>
      </article>

      <article class="setup-path-card glass" id="setup-path-email">
        <span class="setup-badge setup-badge--email" id="setup-email-badge">1 сутки</span>
        <h2 class="setup-path-card__title" id="setup-email-title"></h2>
        <p class="muted setup-path-card__lead" id="setup-email-lead"></p>
        <div id="setup-journey" class="flow-journey hidden" aria-label="Шаги настройки"></div>
        <section id="setup-signup" class="setup-email-form">
          <p id="signup-step-badge" class="step-badge hidden"></p>
          <ol class="setup-steps muted" id="setup-steps-list" aria-label="Шаги"></ol>
          <label class="field-label" for="signup-email" id="signup-email-label"></label>
          <input type="email" class="field-input" id="signup-email" autocomplete="email" inputmode="email" required>
          <label class="field-label" for="signup-phone" id="signup-phone-label"></label>
          <input type="tel" class="field-input" id="signup-phone" autocomplete="tel" inputmode="tel">
          <p class="muted" id="signup-consent-note"></p>
          <label class="checkbox-row">
            <input type="checkbox" id="signup-terms">
            <span id="signup-terms-label"></span>
          </label>
          <div class="actions">
            <button type="button" class="btn btn--secondary btn--block" id="btn-signup-submit"></button>
          </div>
          <p id="signup-note" class="muted setup-note"></p>
        </section>
      </article>
    </div>

    <details class="fold glass setup-recover" id="setup-recover-fold">
      <summary id="recover-fold-title">Уже получал доступ на сайте?</summary>
      <div class="setup-recover__body">
        <p id="recover-lead" class="muted"></p>
        <p class="muted setup-recover-hint" id="recover-tg-hint"></p>
        <a class="btn btn--ghost btn--block" id="btn-recover-tg-id" href="https://t.me/Bender_KVN_bot?start=show_id" target="_blank" rel="noopener"></a>
        <label class="field-label" for="recover-email" id="recover-email-label"></label>
        <input type="email" class="field-input" id="recover-email" autocomplete="email" inputmode="email">
        <div class="actions">
          <button type="button" class="btn btn--secondary btn--block" id="btn-recover-submit"></button>
        </div>
      </div>
    </details>

    <section id="setup-content" class="hidden glass panel setup-ready">
      <header class="setup-ready__head">
        <h2 class="setup-ready__title" id="config-ready-title"></h2>
        <p class="setup-ready__lead muted" id="config-ready-lead"></p>
        <p class="setup-ready__note" id="auto-profile-note"></p>
      </header>
      <p id="setup-success-msg" class="note note-accent hidden"></p>
      <p id="setup-after-vpn" class="note hidden"></p>
      <p id="setup-step1-lead" class="lead hidden"></p>
      <div class="panel hidden" id="customer-id-panel">
        <p class="field-label" id="customer-id-label"></p>
        <p class="customer-id-box" id="customer-id-value"></p>
        <p class="muted" id="customer-id-hint"></p>
        <button type="button" class="btn btn--secondary btn--block" id="btn-copy-id"></button>
      </div>
      <p class="callout callout--warn" id="setup-device-rule" role="note"></p>
      <div class="panel qr-wrap" id="setup-qr-panel">
        <canvas id="setup-qr" aria-label="QR-код"></canvas>
        <p class="banner banner--warn hidden" id="setup-qr-fallback" role="alert"></p>
      </div>
      <details class="fold fold--inline" id="setup-link-fold">
        <summary id="setup-link-toggle">Ссылка подписки</summary>
        <p class="setup-link-wrap muted"><span id="setup-link" class="setup-link" role="text"></span></p>
      </details>
      <div class="actions">
        <button type="button" class="btn btn--primary btn--block" id="btn-copy"></button>
        <a class="btn btn--secondary btn--block" id="btn-setup-instruction" href="/portal/guide.html?v=27"></a>
        <a class="btn btn--ghost btn--block" id="btn-open-happ" href="#" rel="noopener"></a>
        <button type="button" class="btn btn--ghost btn--block hidden" id="btn-toggle-qr"></button>
      </div>
      <div class="panel glass" id="setup-device-pick">
        <h2 class="sheet__label" id="device-pick-title">Выбери устройство</h2>
        <div class="device-grid device-grid--setup" id="setup-device-grid"></div>
      </div>
      <div class="panel">
        <h2 id="platform-downloads-title" class="sheet__label"></h2>
        <div class="actions" id="platform-downloads"></div>
        <h2 id="happ-steps-title" class="sheet__label" style="margin-top:0.75rem"></h2>
        <ol class="steps" id="happ-steps"></ol>
        <p style="margin-top:0.75rem">
          <a class="btn btn--secondary btn--block" id="btn-setup-guide" href="/portal/guide.html?v=27"></a>
        </p>
      </div>
      <section id="bind-tg-panel" class="panel hidden">
        <h2 id="bind-tg-title" class="section-title" style="font-size:1.05rem;margin-top:0"></h2>
        <p class="muted" id="bind-tg-lead"></p>
        <div class="actions">
          <a class="btn btn--secondary btn--block" id="btn-bind-tg" href="#" target="_blank" rel="noopener"></a>
          <button type="button" class="btn btn--ghost btn--block" id="btn-copy-bind"></button>
        </div>
        <p class="muted" id="bind-tg-note"></p>
      </section>
    </section>

    <div id="support-block-mount"></div>
    <div id="site-footer-mount"></div>
  </main>
</body>
</html>
