<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>BenderVPN — получить настройку</title>
  <link rel="stylesheet" href="/portal/assets/portal.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="/portal/assets/qrcode.min.js" defer></script>
  <script src="/portal/assets/portal-shared.js" defer></script>
  <script src="/portal/assets/setup.js" defer></script>
</head>
<body class="cosmic">
  <div class="cosmic-bg" aria-hidden="true"></div>
  <main>
    <header class="top top--sub">
      <h1 class="brand-name" id="setup-title">BenderVPN</h1>
      <a class="nav-link" href="/start/">← Главная</a>
    </header>
    <p id="setup-lead" class="lead"></p>
    <div id="setup-journey" class="flow-journey hidden" aria-label="Шаги настройки"></div>

    <p id="setup-loading" class="note hidden" role="status"></p>
    <p id="setup-error" class="banner banner--error hidden" role="alert"></p>
    <p id="setup-error-help" class="hidden" style="margin-top:0.5rem">
      <a class="btn btn--ghost btn-no-code" id="setup-error-help-link" href="/start/help/errors/"></a>
    </p>

    <section id="setup-signup" class="panel glass">
      <p id="signup-step-badge" class="step-badge hidden"></p>
      <h2 id="signup-heading" class="section-title" style="margin-top:0"></h2>
      <p id="signup-lead" class="muted"></p>
      <label class="field-label" for="signup-email" id="signup-email-label"></label>
      <input type="email" class="field-input" id="signup-email" autocomplete="email" inputmode="email" required>
      <label class="field-label" for="signup-phone" id="signup-phone-label"></label>
      <input type="tel" class="field-input" id="signup-phone" autocomplete="tel" inputmode="tel">
      <p class="muted" id="signup-consent-note"></p>
      <label class="checkbox-row">
        <input type="checkbox" id="signup-terms">
        <span id="signup-terms-label"></span>
      </label>
      <div class="actions">
        <button type="button" class="btn btn--primary btn--block" id="btn-signup-submit"></button>
      </div>
      <p id="signup-note" class="muted"></p>

      <hr class="panel-divider">
      <h2 id="recover-heading" class="section-title" style="font-size:1.05rem"></h2>
      <p id="recover-lead" class="muted"></p>
      <label class="field-label" for="recover-email"></label>
      <input type="email" class="field-input" id="recover-email" autocomplete="email" inputmode="email">
      <div class="actions">
        <button type="button" class="btn btn--secondary btn--block" id="btn-recover-submit"></button>
      </div>
    </section>

    <section id="setup-content" class="hidden glass panel">
      <p id="setup-success-msg" class="note note-accent"></p>
      <p id="setup-after-vpn" class="note hidden"></p>
      <p id="setup-step1-lead" class="lead hidden"></p>
      <div class="panel hidden" id="customer-id-panel">
        <p class="field-label" id="customer-id-label"></p>
        <p class="customer-id-box" id="customer-id-value"></p>
        <p class="muted" id="customer-id-hint"></p>
        <button type="button" class="btn btn--secondary btn--block" id="btn-copy-id"></button>
      </div>
      <p class="callout callout--warn" id="setup-device-rule" role="note"></p>
      <div class="panel qr-wrap" id="setup-qr-panel">
        <canvas id="setup-qr" aria-label="QR-код"></canvas>
        <p class="banner banner--warn hidden" id="setup-qr-fallback" role="alert"></p>
      </div>
      <details class="fold fold--inline" id="setup-link-fold">
        <summary id="setup-link-toggle">Ссылка подписки</summary>
        <p class="setup-link-wrap muted"><span id="setup-link" class="setup-link" role="text"></span></p>
      </details>
      <div class="actions">
        <a class="btn btn--primary btn--block" id="btn-open-happ" href="#" rel="noopener"></a>
        <button type="button" class="btn btn--secondary btn--block" id="btn-copy"></button>
        <button type="button" class="btn btn--ghost btn--block hidden" id="btn-toggle-qr"></button>
        <a class="btn btn--ghost btn--block" id="btn-setup-instruction" href="/start/#devices"></a>
      </div>
      <div class="panel">
        <h2 id="platform-downloads-title" class="sheet__label"></h2>
        <div class="actions" id="platform-downloads"></div>
        <h2 id="happ-steps-title" class="sheet__label" style="margin-top:0.75rem"></h2>
        <ol class="steps" id="happ-steps"></ol>
        <p style="margin-top:0.75rem">
          <a class="btn btn--secondary btn--block" id="btn-setup-guide" href="/portal/guide.html"></a>
        </p>
      </div>
      <section id="bind-tg-panel" class="panel hidden">
        <h2 id="bind-tg-title" class="section-title" style="font-size:1.05rem;margin-top:0"></h2>
        <p class="muted" id="bind-tg-lead"></p>
        <div class="actions">
          <a class="btn btn--secondary btn--block" id="btn-bind-tg" href="#" target="_blank" rel="noopener"></a>
          <button type="button" class="btn btn--ghost btn--block" id="btn-copy-bind"></button>
        </div>
        <p class="muted" id="bind-tg-note"></p>
      </section>
    </section>

    <div id="site-footer-mount"></div>
  </main>
</body>
</html>
