<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0E14">
<title>BenderVPN — Баланс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0A0E14; --surface:#141A22; --elevated:#1C242E; --border:rgba(255,255,255,.06);
    --accent:#FF6B1A; --accent-hover:#FF8340; --accent-press:#E0550C;
    --accent-tint:rgba(255,107,26,.10); --accent-glow:rgba(255,107,26,.45);
    --text:#F2F4F7; --text-dim:#9AA4B2; --text-mute:#5B6573;
    --success:#2FBF71; --warning:#F5B33C; --error:#E5484D;
    --font:'Onest',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#05070b;font-family:var(--font);color:var(--text);display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
  .phone{width:100%;max-width:440px;height:100vh;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
  @media(min-width:480px){body{padding:20px}.phone{height:min(880px,calc(100vh - 40px));border-radius:22px;border:1px solid var(--border)}}
  #bgfx{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .scroll{flex:1;overflow-y:auto;position:relative;z-index:1}

  .topbar{display:flex;align-items:center;gap:12px;padding:16px 18px;position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,transparent)}
  .back{width:34px;height:34px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-dim);cursor:pointer}
  .back svg{width:18px;height:18px}
  .tb-title{font-weight:700;font-size:18px}

  .content{padding:4px 18px 24px;display:flex;flex-direction:column;gap:16px}

  /* баланс-герой */
  .bal-card{background:linear-gradient(135deg,rgba(255,107,26,.06),rgba(20,26,34,.92));border:1px solid var(--border);border-radius:20px;padding:24px;position:relative;overflow:hidden}
  .bal-card::before{content:"";position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,var(--accent-tint),transparent 70%)}
  .bal-label{color:var(--text-dim);font-size:13px;font-weight:500}
  .bal-amount{font-weight:700;font-size:44px;letter-spacing:-.03em;margin:4px 0 2px;color:var(--accent)}
  .bal-runway{display:inline-flex;align-items:center;gap:8px;color:var(--text);font-size:15px;font-weight:600;margin-top:10px}
  .bal-runway svg{width:16px;height:16px;color:var(--accent)}
  .bal-rate{color:var(--text-mute);font-size:12.5px;margin-top:14px;display:flex;align-items:center;gap:7px}
  .bal-rate svg{width:14px;height:14px}

  .label-sm{color:var(--text-mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:2px 2px -4px}

  /* пресеты */
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .preset{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:18px 16px;cursor:pointer;transition:.16s;position:relative;text-align:left;font-family:var(--font)}
  .preset:hover{border-color:rgba(255,107,26,.35);transform:translateY(-2px)}
  .preset.sel{border-color:var(--accent);border-width:2px;background:var(--surface);box-shadow:0 0 0 3px rgba(255,107,26,.12)}
  .preset .days{font-weight:700;font-size:21px;color:var(--text);letter-spacing:-.01em}
  .preset .price{color:var(--accent);font-weight:700;font-size:16px;margin-top:6px}
  .preset .per{color:var(--text-mute);font-size:11.5px;margin-top:5px}
  .preset .tag{position:absolute;top:13px;right:13px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--success);background:rgba(47,191,113,.14);border:1px solid rgba(47,191,113,.25);padding:3px 8px;border-radius:999px}

  /* своя сумма */
  .custom{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:16px;display:flex;align-items:center;gap:12px}
  .custom .ci{color:var(--text-dim);font-size:14px;font-weight:500;flex:none}
  .custom input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--font);font-weight:700;font-size:20px;outline:none;width:100%}
  .custom input::placeholder{color:var(--text-mute);font-weight:600}
  .custom .cur{color:var(--text-dim);font-weight:700;font-size:18px}
  .custom.err{border-color:rgba(229,72,77,.5)}
  .custom-hint{color:var(--text-mute);font-size:11.5px;padding:0 2px;margin-top:-8px}
  .custom-hint.err{color:var(--error)}

  /* оплата */
  .pay-note{display:flex;gap:10px;color:var(--text-mute);font-size:12px;line-height:1.45;padding:0 2px}
  .pay-note svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--text-dim)}
  .cta{width:100%;border:none;cursor:pointer;font-family:var(--font);font-weight:700;font-size:16px;color:#1a0c02;background:var(--accent);border-radius:14px;padding:17px;transition:.18s;display:flex;align-items:center;justify-content:center;gap:9px}
  .cta:hover{background:var(--accent-hover);box-shadow:0 6px 24px var(--accent-glow)}
  .cta:disabled{background:var(--elevated);color:var(--text-mute);cursor:not-allowed;box-shadow:none}
  .cta svg{width:18px;height:18px}

  /* история */
  .hist{display:flex;flex-direction:column;gap:1px;border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .hrow{display:flex;align-items:center;gap:12px;background:var(--surface);padding:14px 16px}
  .hrow .hi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
  .hrow .hi.in{background:rgba(47,191,113,.12);color:var(--success)}
  .hrow .hi.out{background:var(--elevated);color:var(--text-mute)}
  .hrow .hi svg{width:16px;height:16px}
  .hrow .ht{font-size:14px;font-weight:500}
  .hrow .hd{color:var(--text-mute);font-size:12px;margin-top:1px}
  .hrow .hv{margin-left:auto;font-weight:600;font-size:14px}
  .hrow .hv.plus{color:var(--success)}
  .hrow .hv.minus{color:var(--text-dim)}
  .hist-empty{color:var(--text-mute);font-size:13px;padding:16px;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:14px}

  .nav{flex:none;position:relative;z-index:2;background:rgba(10,14,20,.95);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 4px 18px}
  .nav a{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:var(--text-mute);font-size:10px;font-weight:500;padding:6px 0;position:relative;cursor:pointer}
  .nav a svg{width:22px;height:22px}
  .nav a.active{color:var(--accent)}
  .nav a.active::before{content:"";position:absolute;top:-9px;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--accent);box-shadow:0 2px 10px var(--accent-glow)}

  /* toast */
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--elevated);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px 18px;font-size:13px;font-weight:500;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .skeleton{color:transparent;background:linear-gradient(90deg,var(--elevated),var(--surface),var(--elevated));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="phone">
  <canvas id="bgfx"></canvas>
  <div class="scroll">
    <div class="topbar">
      <div class="back" id="btn-back" title="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="tb-title">Баланс</div>
    </div>

    <div class="content">
      <!-- ГЕРОЙ-БАЛАНС -->
      <div class="bal-card">
        <div class="bal-label">На счету</div>
        <div class="bal-amount" id="bal-amount"><span class="skeleton">000 ₽</span></div>
        <div class="bal-runway" id="bal-runway" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18" stroke-linecap="round"/></svg><span id="bal-runway-text"></span></div>
        <div class="bal-rate" id="bal-rate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3" stroke-linecap="round"/></svg><span id="bal-rate-text"></span></div>
      </div>

      <!-- ПРЕСЕТЫ -->
      <div class="label-sm">Пополнить</div>
      <div class="presets" id="presets"></div>

      <!-- СВОЯ СУММА -->
      <div class="custom" id="custom-wrap">
        <span class="ci">Своя сумма</span>
        <input type="number" id="custom-input" inputmode="numeric" placeholder="0" />
        <span class="cur">₽</span>
      </div>
      <div class="custom-hint" id="custom-hint"></div>

      <!-- ОПЛАТА -->
      <button class="cta" id="btn-pay" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg><span id="btn-pay-text">Пополнить</span></button>
      <div class="pay-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Оплата через защищённый платёжный сервис. Карту вводишь на странице банка, не у нас.</div>

      <!-- ИСТОРИЯ -->
      <div class="label-sm">История</div>
      <div id="hist-mount"><div class="hist-empty">Загрузка…</div></div>
    </div>
  </div>

  <nav class="nav">
    <a data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10" stroke-linecap="round" stroke-linejoin="round"/></svg>Главная</a>
    <a data-nav="access"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>Доступ</a>
    <a class="active" data-nav="balance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>Баланс</a>
    <a data-nav="referral"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 6a3 3 0 0 1 0 6M19 20a6 6 0 0 0-3-5"/></svg>Рефералы</a>
    <a data-nav="support"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Поддержка</a>
  </nav>
  <div class="toast" id="toast"></div>
</div>

<script>
// binary code-rain background (presentational, from mockup)
const bg=document.getElementById('bgfx'),bx=bg.getContext('2d');
let DPR=Math.min(devicePixelRatio||1,2),BW,BH,drops;
function s(){BW=bg.clientWidth;BH=bg.clientHeight;bg.width=BW*DPR;bg.height=BH*DPR;bx.setTransform(DPR,0,0,DPR,0,0);
  const st=16,c=Math.ceil(BW/st);drops=[];for(let i=0;i<c;i++)drops.push({x:i*st+4,y:Math.random()*BH,sp:.6+Math.random()*1.2,ch:Math.random()<.5?'0':'1',flip:Math.random()*100});}
s();addEventListener('resize',s);bx.textAlign='center';bx.textBaseline='middle';
(function f(){bx.clearRect(0,0,BW,BH);bx.font='13px Onest, monospace';
  for(const d of drops){d.y+=d.sp;if(d.y>BH+8){d.y=-8;}d.flip++;if(d.flip>30){d.flip=0;d.ch=Math.random()<.5?'0':'1';}
    for(let k=0;k<5;k++){const yy=d.y-k*16;if(yy<0||yy>BH)continue;const a=(1-k/5)*0.07;bx.fillStyle='rgba(200,210,225,'+a+')';bx.fillText(k===0?d.ch:(Math.random()<.5?'0':'1'),d.x,yy);}}
  requestAnimationFrame(f);})();
</script>
<script src="/portal/assets/balance.js?v=1" defer></script>
</body>
</html>
